<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hosting</title>
    <link rel="stylesheet" href="estilos/estilos.css">
</head>
<body>

    <header>
        <h1>TechNova Solutions</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="quienes.html">Quiénes somos</a>
            <a href="donde.html">Dónde estamos</a>
            <a href="referencias.html">Referencias</a>
            <a href="tienda.html">Tienda</a>
            <a class="nav-carrito" href="carrito.html">Carrito</a>
        </nav>
    </header>

    <div class="container">

        <div class="card">

            <h2>Hosting</h2>

            <img src="imagenes/prod3.jpg"
                 alt="Hosting"
                 width="300">

            <p>
                Alojamiento para que tu página web esté siempre disponible en internet.
            </p>

            <p>
                <strong>Precio: 99€/año</strong>
            </p>

            <button class="btn" onclick="agregarCarrito()">
                Añadir al carrito
            </button>

        </div>

    </div>

    <script>

        function agregarCarrito() {

            let carrito =
                JSON.parse(localStorage.getItem("carrito")) || [];

            carrito.push({
                nombre: "Hosting",
                precio: 99
            });

            localStorage.setItem(
                "carrito",
                JSON.stringify(carrito)
            );

            alert("Producto añadido al carrito");

        }

    </script>

</body>
</html>
